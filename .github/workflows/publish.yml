name: Release

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and package without publishing. Select a version tag to publish."
        type: boolean
        default: true

permissions: {}

# Serialize registry changes, including maintenance branches and reruns.
concurrency:
  group: release-registries
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'stoopid-computers/effective-jev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      filename: ${{ steps.release.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"
      - run: npm ci
      - name: Validate release branch, tag, versions, and notes
        id: release
        run: npm run release:check -- --remote
      - name: Test and package both registries
        run: npm run release:pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: package
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: release/
      - name: Require the exact public release commit
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$REPOSITORY_PRIVATE" = false || { echo 'Registry provenance requires a public repository'; exit 1; }
          npm run release:check -- --remote --publish
      - name: Publish the tested npm tarball
        run: npm run release:publish:npm
      - name: Publish matching TypeScript sources to JSR
        run: npm run release:publish:jsr
      - name: Verify both registries and select GitHub latest status
        id: verify
        run: npm run release:verify
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.package.outputs.prerelease }}
          RELEASE_LATEST: ${{ steps.verify.outputs.make_latest }}
          RELEASE_FILENAME: ${{ needs.package.outputs.filename }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release/release-notes.md --draft=false --prerelease="$RELEASE_PRERELEASE" --latest="$RELEASE_LATEST"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release/release-notes.md --prerelease="$RELEASE_PRERELEASE" --latest="$RELEASE_LATEST"
          fi
          gh release upload "$RELEASE_TAG" "release/$RELEASE_FILENAME" release/SHA256SUMS release/release.json release/source-files.json release/jsr-files.json --clobber
      - name: Summarize release
        env:
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: echo "Verified $RELEASE_TAG on npm and JSR and attached its package and checksums to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
